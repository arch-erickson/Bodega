<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gonzales Bodega Menu</title>
<meta name="description" content="Kitchen and store menu. Order on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Inter:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sign.css">
<style>
  :root {
    --bg: #ffffff;
    --tile: #f1f1f3;
    --ink: #1a1a1a;
    --muted: #8a8a8e;
    --line: #e7e7ea;
    --accent: #1a1a1a;
    --red: #d0021b;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --gutter: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--sign-h, 0px) + 100px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  img { display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* Plain header (replaced by the 3D sign) */
  .site-head { text-align: center; padding: 36px var(--gutter) 18px; }
  .site-head h1 { font-weight: 800; font-size: 32px; letter-spacing: -.02em; margin: 0; }
  .site-head p { margin: 6px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .04em; }

  /* Category nav: main row + sub row */
  nav { position: sticky; top: var(--sign-h, 0px); z-index: 10; background: rgba(255,255,255,.94);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  nav .scroller { display: flex; gap: 22px; overflow-x: auto; padding: 14px var(--gutter); scrollbar-width: none;
                  max-width: 1200px; margin: 0 auto; }
  nav .scroller::-webkit-scrollbar { display: none; }
  nav .scroller > :first-child { margin-left: auto; }
  nav .scroller > :last-child { margin-right: auto; }
  nav a { flex: none; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
          text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; }
  nav a.on { color: var(--ink); border-bottom-color: var(--ink); }
  nav .main { gap: 14px; }
  nav .main a { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  @media (min-width: 420px) { nav .main { gap: 22px; } nav .main a { font-size: 13px; letter-spacing: .08em; } }
  nav .sub { border-top: 1px solid var(--line); padding-top: 11px; padding-bottom: 11px; gap: 18px; }
  nav .sub:empty { display: none; }
  nav .sub a { font-weight: 600; }

  main { max-width: 1200px; margin: 0 auto; padding: 0 var(--gutter) 120px; }

  .group-title { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
                 text-align: center; margin: 40px 0 0; }
  .group-note { text-align: center; font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  section h2 { font-weight: 700; font-size: 22px; letter-spacing: -.01em; text-align: center; margin: 36px 0 20px; }
  section h2 + .hours { margin: -14px 0 22px; }
  .hours { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .hours .now { display: none; color: #1a7f37; margin-left: 8px; }
  .hours .now::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #1a7f37; margin-right: 6px; vertical-align: 1px; }
  section.serving .hours .now { display: inline; }

  /* Home: the 5 main categories */
  .cats { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px 12px; margin-top: 36px; }
  .cat { width: calc(50% - 6px); text-align: center; text-decoration: none; color: var(--ink); }
  @media (min-width: 700px) { .cats { gap: 16px; margin-top: 44px; } .cat { width: calc(20% - 13px); } }
  .cat .tile img { max-width: 72%; max-height: 72%; }
  .cat .label { display: block; margin-top: 12px; font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .cat .hint2 { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
  .cat .info-face { font-weight: 800; font-size: clamp(44px, 10vw, 68px); line-height: 1; text-align: center; }
  .cat .info-face small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
  .cat .deal-face { position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 800; color: var(--red); letter-spacing: .04em; }

  /* Item grid: 2 per row on phones, 4 on tablet and desktop */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 14px; } }
  @media (min-width: 1100px) { .grid { gap: 48px 18px; } }

  .item { text-align: center; }
  .tile { position: relative; aspect-ratio: 1 / 1; background: var(--tile); display: grid; place-items: center;
          width: 100%; overflow: hidden; }
  .tile img { max-width: 58%; max-height: 66%; width: auto; height: auto; object-fit: contain; transition: transform .4s ease; }
  /* Kitchen dishes are normalized 800x800 squares: show them all in the same box, centered */
  .item.kitchen:not(.combo) .tile > img { width: 92%; height: 92%; max-width: none; max-height: none; object-fit: contain; object-position: center; }
  .tile:hover img { transform: scale(1.04); }
  .badge { position: absolute; bottom: 10px; right: 10px; min-width: 22px; height: 22px; padding: 0 6px;
           border-radius: 11px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; line-height: 22px; display: none; }
  .item.in .badge { display: block; }
  .num { position: absolute; top: 10px; right: 12px; font-size: 11px; font-weight: 700; letter-spacing: .02em; color: var(--ink);
         font-variant-numeric: tabular-nums; opacity: .7; }
  .off { position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 800; color: var(--red); }
  .name { font-weight: 700; font-size: 15px; line-height: 1.25; margin: 12px 4px 0; letter-spacing: -.01em; }
  @media (min-width: 700px) { .name { font-size: 16px; } }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
  .price { font-size: 14px; font-weight: 800; color: #000; margin-top: 7px; font-variant-numeric: tabular-nums; }
  @media (min-width: 700px) { .price { font-size: 15px; } }
  .price .was { font-weight: 500; color: var(--muted); text-decoration: line-through; margin-left: 6px; font-size: .8em; }
  .item.deal .price { color: var(--red); }
  .parts { list-style: none; padding: 0; margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .parts li span { color: var(--ink); font-weight: 700; font-size: 11px; margin-right: 4px; }

  /* Combo: items shown together on one tile */
  .stack { position: relative; width: 86%; height: 72%; transition: transform .4s ease; }
  .stack img { position: absolute; bottom: 0; object-fit: contain; object-position: center bottom; max-width: none !important; max-height: none !important; }
  .stack .p0 { left: 0; width: 64%; height: 78%; bottom: 6%; object-position: center; z-index: 1; }
  .stack .p1 { right: 13%; width: 30%; height: 58%; z-index: 3; }
  .stack .p2 { right: 0; width: 20%; height: 82%; z-index: 2; }
  .stack.n2 .p1 { right: 2%; width: 28%; height: 74%; }
  .tile:hover .stack img { transform: none; }
  .tile:hover .stack { transform: scale(1.03); }

  .qty { display: inline-flex; align-items: center; margin-top: 10px; height: 28px; }
  .qty .add { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 6px 10px;
              border-bottom: 1.5px solid var(--ink); }
  .qty .step { display: none; align-items: center; border: 1px solid var(--line); height: 28px; }
  .qty .step button { width: 30px; height: 26px; font-size: 15px; }
  .qty .step span { min-width: 22px; font-size: 12px; font-weight: 700; }
  .item.in .qty .add { display: none; }
  .item.in .qty .step { display: inline-flex; }

  /* Info: card layout, left-aligned for easy reading */
  .info { max-width: 1040px; margin: 28px auto 0; display: grid; gap: 14px; text-align: left; }
  @media (min-width: 900px) {
    .info { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; margin-top: 36px; }
    .info .span-12 { grid-column: span 12; } .info .span-5 { grid-column: span 5; } .info .span-7 { grid-column: span 7; }
  }
  .card { background: var(--tile); padding: 22px 20px; position: relative; }
  @media (min-width: 900px) { .card { padding: 30px 32px; } }
  .info section h2 { text-align: left; margin: 0 0 18px; font-size: 11px; font-weight: 800; letter-spacing: .16em;
                     text-transform: uppercase; color: var(--muted); }
  .info p { font-size: 15px; line-height: 1.55; margin: 0; }
  .info .muted { color: var(--muted); font-size: 13px; }

  /* Status / contact card */
  .status { display: grid; gap: 20px; }
  @media (min-width: 900px) { .status { grid-template-columns: 1fr auto; align-items: end; } }
  .status .big { font-size: clamp(30px, 6vw, 44px); font-weight: 800; letter-spacing: -.03em; line-height: 1; margin: 0; }
  .status .line2 { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; }
  .dot { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
  .dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #1a7f37; box-shadow: 0 0 0 4px rgba(26,127,55,.15); }
  .dot.closed::before { background: var(--red); box-shadow: 0 0 0 4px rgba(208,2,27,.12); }
  .status .phone { font-variant-numeric: tabular-nums; font-weight: 700; }
  .actions { display: grid; gap: 8px; }
  @media (min-width: 520px) { .actions { grid-template-columns: auto auto; } }
  .actions .btn { padding: 14px 22px; white-space: nowrap; }
  .card .btn.ghost { background: #fff; border-color: #fff; }

  /* Hours */
  .hours-list { list-style: none; margin: 0; padding: 0; }
  .hours-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 13px 0;
                   border-bottom: 1px solid #e2e2e6; font-size: 15px; }
  .hours-list li:last-child { border-bottom: 0; }
  .hours-list .k { font-weight: 600; }
  .hours-list .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .hours-list .group { padding-top: 22px; border-bottom: 0; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .hours-list li.now .k::after { content: "Now"; margin-left: 8px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
                                 color: #fff; background: #1a7f37; padding: 2px 7px; border-radius: 10px; vertical-align: 2px; }

  /* Location */
  .addr { font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
  .map { margin: 18px 0 14px; aspect-ratio: 16 / 9; background: #e6e6ea; overflow: hidden; }
  .map iframe { width: 100%; height: 100%; border: 0; display: block; filter: grayscale(.35) contrast(1.05); }
  .loc-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .loc-row .btn { padding: 12px 18px; }

  /* How to order */
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; counter-reset: s; }
  @media (min-width: 700px) { .steps { grid-template-columns: repeat(3, 1fr); gap: 28px; } }
  .steps li { counter-increment: s; font-size: 15px; line-height: 1.5; }
  .steps li::before { content: counter(s, decimal-leading-zero); display: block; font-size: 30px; font-weight: 800; letter-spacing: -.03em;
                      line-height: 1; margin-bottom: 10px; }
  .steps b { display: block; font-size: 16px; margin-bottom: 4px; }
  .steps span { color: #55555a; }
  .tip { margin-top: 26px; padding-top: 20px; border-top: 1px solid #e2e2e6; display: flex; gap: 14px; align-items: center; }
  .tip .tag { flex: none; background: #fff; font-size: 12px; font-weight: 800; padding: 8px 10px; font-variant-numeric: tabular-nums; }
  .tip p { font-size: 14px; color: #55555a; }

  /* Bottom bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 12px var(--gutter) calc(12px + env(safe-area-inset-bottom));
         background: linear-gradient(to top, #fff 70%, rgba(255,255,255,0)); display: none; }
  .bar.show { display: block; }
  .bar button { width: 100%; max-width: 520px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;
                background: var(--accent); color: #fff; padding: 15px 20px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .bar button b { font-weight: 800; font-size: 15px; }

  /* Floating WhatsApp button */
  .wa-fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 25;
            width: 58px; height: 58px; border-radius: 50%; background: #25d366; color: #fff; display: grid; place-items: center;
            box-shadow: 0 6px 18px rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.12); transition: transform .2s ease, bottom .25s ease, opacity .2s; }
  .wa-fab:hover { transform: scale(1.06); }
  .wa-fab svg { width: 32px; height: 32px; }
  .bar.show ~ .wa-fab { bottom: calc(86px + env(safe-area-inset-bottom)); }
  body.open .wa-fab { opacity: 0; pointer-events: none; }
  @media (min-width: 900px) { .wa-fab { right: 24px; bottom: 24px; width: 62px; height: 62px; } .bar.show ~ .wa-fab { bottom: 96px; } }

  /* Order sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: fixed; z-index: 31; background: #fff; display: flex; flex-direction: column;
           left: 0; right: 0; bottom: 0; max-height: 88vh; transform: translateY(100%); transition: transform .25s ease; }
  @media (min-width: 900px) { .sheet { left: auto; top: 0; max-height: none; width: 420px; transform: translateX(100%); } }
  body.open .scrim { opacity: 1; pointer-events: auto; }
  body.open .sheet { transform: none; }
  .sheet header { padding: 22px var(--gutter) 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .sheet header h3 { font-weight: 800; font-size: 20px; margin: 0; }
  .sheet header button { font-size: 12px; color: var(--muted); }
  .sheet .body { overflow-y: auto; padding: 4px var(--gutter) 16px; }
  .line { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .line .thumb { width: 52px; height: 52px; background: var(--tile); display: grid; place-items: center; }
  .line .thumb img { max-width: 70%; max-height: 80%; }
  .line .t { font-weight: 700; font-size: 14px; line-height: 1.2; }
  .line .p { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .line .p b { color: #000; font-weight: 800; font-size: 13px; }
  .line .step { display: inline-flex; align-items: center; border: 1px solid var(--line); height: 28px; }
  .line .step button { width: 28px; height: 26px; }
  .line .step span { min-width: 20px; text-align: center; font-size: 12px; font-weight: 700; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 6px; font-size: 13px; }
  .total b { font-size: 22px; font-weight: 800; color: #000; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; border: 1px solid var(--line); padding: 11px 12px; font: inherit; font-size: 16px; border-radius: 0; background: #fff; }
  .field textarea { resize: vertical; min-height: 64px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); }
  .seg button { padding: 11px; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
  .seg button.on { background: var(--ink); color: #fff; }
  .sheet footer { padding: 12px var(--gutter) calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .btn { display: block; text-align: center; padding: 15px; font-size: 13px; font-weight: 700; letter-spacing: .02em; text-decoration: none; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.ghost { border: 1px solid var(--line); color: var(--ink); }
  .hint { font-size: 11px; color: var(--muted); text-align: center; }

  .site-foot { text-align: center; font-size: 11px; color: var(--muted); padding: 40px var(--gutter) 0; line-height: 1.8; }
  .site-foot a { color: var(--ink); }
</style>
</head>
<body>

<header class="bodega-sign" title="Back to menu home">
  <div class="bs-stage">
    <h1 class="bs-name" id="storeName">Gonzales Bodega</h1>
    <p class="bs-sub" id="storeLine">Deli • Grocery • 24 Hrs</p>
  </div>
</header>

<nav aria-label="Menu categories"><div class="scroller main" id="nav"></div><div class="scroller sub" id="subnav"></div></nav>

<main id="menu"></main>

<div class="bar" id="bar"><button id="openBag" type="button"><span id="barCount">0 items</span><span>View order · <b id="barTotal">$0.00</b></span></button></div>

<a class="wa-fab" id="waFab" href="https://wa.me/19172153208" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp">
  <svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor"><path d="M16.04 3C8.86 3 3.03 8.82 3.03 16c0 2.3.6 4.53 1.74 6.5L3 29l6.68-1.75A12.95 12.95 0 0 0 16.04 29C23.2 29 29 23.18 29 16S23.2 3 16.04 3zm0 23.62c-1.98 0-3.92-.53-5.61-1.54l-.4-.24-3.97 1.04 1.06-3.86-.26-.4A10.6 10.6 0 0 1 5.4 16c0-5.86 4.77-10.63 10.64-10.63 5.86 0 10.6 4.77 10.6 10.63 0 5.87-4.76 10.62-10.6 10.62zm5.83-7.96c-.32-.16-1.89-.93-2.18-1.04-.3-.1-.51-.16-.72.16-.21.32-.83 1.04-1.01 1.25-.19.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.59-.95-.85-1.59-1.9-1.78-2.22-.18-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.18.21-.32.32-.53.1-.21.05-.4-.03-.56-.08-.16-.72-1.73-.99-2.37-.26-.62-.52-.54-.72-.55h-.61c-.21 0-.56.08-.85.4-.29.32-1.12 1.09-1.12 2.66s1.15 3.09 1.31 3.3c.16.21 2.26 3.45 5.47 4.84.76.33 1.36.53 1.83.68.77.24 1.47.21 2.02.13.62-.09 1.89-.77 2.16-1.52.27-.74.27-1.38.19-1.52-.08-.13-.29-.21-.61-.37z"/></svg>
</a>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-label="Your order">
  <header><h3>Your order</h3><button type="button" id="closeBag">Close</button></header>
  <div class="body">
    <div id="lines"></div>
    <div class="total"><span>Total</span><b id="sheetTotal">$0.00</b></div>
    <div class="field">
      <label>Pickup or delivery</label>
      <div class="seg" id="mode"><button type="button" data-mode="Pickup" class="on">Pickup</button><button type="button" data-mode="Delivery">Delivery</button></div>
    </div>
    <div class="field" id="addrField" hidden><label for="addr">Delivery address</label><input id="addr" autocomplete="street-address" placeholder="Street, apt, cross street"></div>
    <div class="field"><label for="cname">Name</label><input id="cname" autocomplete="name" placeholder="For the order"></div>
    <div class="field"><label for="notes">Notes</label><textarea id="notes" placeholder="Salt, pepper, ketchup. No onions…"></textarea></div>
  </div>
  <footer>
    <a class="btn primary" id="sendWa" href="#" target="_blank" rel="noopener">Send order on WhatsApp</a>
    <a class="btn ghost" id="callWa" href="#" target="_blank" rel="noopener">Call us on WhatsApp</a>
    <div class="hint">Your order opens in WhatsApp, ready to send.</div>
  </footer>
</aside>

<footer class="site-foot" id="siteFoot"></footer>

<script>
/* ============ EDIT YOUR STORE HERE ============ */
const STORE = {
  name: "Gonzales Bodega",
  whatsapp: "19172153208",          // country code + number, digits only
  address: "Third Avenue, New York, NY",
};

/* Each item: id (matches images/<id>.webp), name, sub (size or short description), price.
   On sale: add  was: <old price>  and it shows in red with the % off (and appears under Other > Deals).
   Combos: combo: [item ids] — the regular price is the sum of the items. */
const KITCHEN_HOURS = "Kitchen open daily 6 AM – 10 PM";
const CATEGORIES = [
  { id: "kitchen", title: "Kitchen", note: KITCHEN_HOURS, cover: ["cheeseburger-deluxe"], hint: "Breakfast · Lunch · Dinner", sections: [
    { id: "breakfast", title: "Breakfast", hours: [6, 11], items: [
      { id: "bacon-egg-cheese", name: "Bacon, Egg & Cheese", sub: "On a roll, salt, pepper, ketchup", price: 6.50, kitchen: true },
      { id: "bagel-cream-cheese", name: "Bagel & Cream Cheese", sub: "Toasted, plain or everything", price: 3.50, kitchen: true },
      { id: "pancakes", name: "Pancakes", sub: "Three stack, butter & syrup", price: 7.19, was: 8.99, kitchen: true },
      { id: "breakfast-burrito", name: "Breakfast Burrito", sub: "Eggs, cheese, potatoes, sausage", price: 9.99, kitchen: true },
    ]},
    { id: "lunch", title: "Lunch", hours: [11, 16], items: [
      { id: "chopped-cheese", name: "Chopped Cheese", sub: "Lettuce, tomato, onion", price: 10.99, kitchen: true },

      { id: "kit-kat", name: "Kit Kat", sub: "1.5 oz bar", price: 1.69, was: 2.29 },
    ]},
  ]},
  { id: "utilities", title: "Utilities", cover: ["tide-detergent", "bounty-paper-towels"], hint: "Household · Personal care", sections: [
    { id: "household", title: "Household", items: [
      { id: "bounty-paper-towels", name: "Bounty Paper Towels", sub: "Select-A-Size, 1 roll", price: 3.99 },
      { id: "charmin-toilet-paper", name: "Charmin Ultra Soft", sub: "6 Mega Rolls", price: 11.99 },
      { id: "dawn-dish-soap", name: "Dawn Dish Soap", sub: "Ultra Original, 18 oz", price: 4.49, was: 5.49 },
      { id: "tide-detergent", name: "Tide Original", sub: "34 oz, 25 loads", price: 9.99 },
    ]},
    { id: "personal-care", title: "Personal Care", items: [
      { id: "colgate-toothpaste", name: "Colgate Toothpaste", sub: "Cavity Protection, 6.4 oz", price: 4.29 },
      { id: "advil", name: "Advil", sub: "200 mg, 50 tablets", price: 9.99 },

      { id: "degree-deodorant", name: "Degree Men", sub: "Cool Rush, 3 oz stick", price: 5.99 },
    ]},
  ]},
  { id: "other", title: "Other", cover: ["ben-jerrys-half-baked", "red-bull"], hint: "Deals · Ice cream", deals: true, sections: [
    { id: "deals", title: "Deals", deals: true, items: [] },
    { id: "ice-cream", title: "Ice Cream", items: [
      { id: "ben-jerrys-half-baked", name: "Ben & Jerry's Half Baked", sub: "16 oz pint", price: 7.49 },
      { id: "haagen-dazs-vanilla", name: "Häagen-Dazs Vanilla", sub: "14 oz pint", price: 6.99, was: 7.99 },
      { id: "klondike-bar", name: "Klondike Bars", sub: "The Original, 6 pack", price: 6.99 },
      { id: "good-humor-strawberry-shortcake", name: "Good Humor Strawberry Shortcake", sub: "6 pack", price: 7.49 },
    ]},
  ]},
  { id: "info", title: "Info", hint: "Hours · Location · Ordering", info: true, sections: [
    { id: "contact", title: "Contact" }, { id: "hours", title: "Hours" }, { id: "location", title: "Location" }, { id: "how-to-order", title: "How to order" },
  ]},
];
/* ============================================== */

const $ = s => document.querySelector(s);
const fmtH = h => (h % 12 || 12) + (h < 12 || h === 24 ? " AM" : " PM");
const fmtHours = ([a, b]) => `${fmtH(a)} – ${fmtH(b)}`;
const money = n => "$" + n.toFixed(2);

const ITEMS = {};
let n = 0, c = 0;
CATEGORIES.forEach(g => g.sections.forEach(s => (s.items || []).forEach(i => {
  ITEMS[i.id] = i;
  i.no = i.combo ? "C" + (++c) : String(++n);
})));
Object.values(ITEMS).filter(i => i.combo).forEach(i => {
  i.kitchen = true;
  i.was = i.combo.reduce((t, id) => t + (ITEMS[id].was || ITEMS[id].price), 0);
  i.sub = i.combo.map(id => ITEMS[id].name).join(" + ");
});
Object.values(ITEMS).forEach(i => { if (i.was > i.price) i.pct = Math.round((1 - i.price / i.was) * 100); });
CATEGORIES.forEach(g => g.sections.forEach(s => { if (s.deals) s.items = Object.values(ITEMS).filter(i => i.pct); }));
const img = id => `images/${ITEMS[id].combo ? ITEMS[id].combo[0] : id}.webp`;
const CAT = Object.fromEntries(CATEGORIES.map(g => [g.id, g]));

let cart = {};
try { cart = JSON.parse(localStorage.getItem("deli-cart") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("deli-cart", JSON.stringify(cart)); } catch (e) {} };
let mode = "Pickup";

document.title = STORE.name + " Menu";
const nav = $("#nav"), subnav = $("#subnav"), menu = $("#menu");
nav.innerHTML = CATEGORIES.map(g => `<a href="#${g.id}" data-cat="${g.id}">${g.title}</a>`).join("");
$("#siteFoot").innerHTML = `${STORE.name} · ${STORE.address}<br>Order on <a href="https://wa.me/${STORE.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>`;

const itemHTML = i => `
  <article class="item${i.kitchen ? " kitchen" : ""}${i.combo ? " combo" : ""}${i.pct ? " deal" : ""}" data-id="${i.id}">
    <button class="tile" type="button" data-act="add" aria-label="Add ${i.name}">
      ${i.combo
        ? `<span class="stack n${i.combo.length}">${i.combo.map((id, k) => `<img class="p${k}" src="images/${id}.webp" alt="${ITEMS[id].name}" loading="lazy" onerror="this.style.visibility='hidden'">`).join("")}</span>`
        : `<img src="images/${i.id}.webp" alt="${i.name}" loading="lazy" onerror="this.style.visibility='hidden'">`}
      <span class="num">#${i.no}</span>${i.pct ? `<span class="off">-${i.pct}%</span>` : ""}
      <span class="badge"></span>
    </button>
    <div class="name">${i.name}</div>
    ${i.combo
      ? `<ul class="parts">${i.combo.map(id => `<li><span>#${ITEMS[id].no}</span>${ITEMS[id].name}</li>`).join("")}</ul>`
      : `<div class="sub">${i.sub}</div>`}
    <div class="price">${money(i.price)}${i.pct ? `<span class="was">${money(i.was)}</span>` : ""}</div>
    <div class="qty">
      <button class="add" type="button" data-act="add">Add</button>
      <span class="step"><button type="button" data-act="dec" aria-label="Remove one">−</button><span class="n">0</span><button type="button" data-act="add" aria-label="Add one">+</button></span>
    </div>
  </article>`;

const coverHTML = g => {
  if (g.info) return `<span class="info-face">i<small>Open 24/7</small></span>`;
  const pics = g.cover.length > 1
    ? `<span class="stack n2">${g.cover.map((id, k) => `<img class="p${k}" src="images/${id}.webp" alt="" onerror="this.style.visibility='hidden'">`).join("")}</span>`
    : `<img src="images/${g.cover[0]}.webp" alt="" onerror="this.style.visibility='hidden'">`;
  return pics + (g.deals ? `<span class="deal-face">DEALS %</span>` : "");
};

const mealHours = CAT.kitchen.sections.filter(s => s.hours);
const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(STORE.name + " " + STORE.address)}`;
const mapEmbed = `https://www.google.com/maps?q=${encodeURIComponent(STORE.address)}&output=embed`;
const phoneLabel = (d => d.length === 11 && d[0] === "1" ? `+1 (${d.slice(1, 4)}) ${d.slice(4, 7)}-${d.slice(7)}` : "+" + d)(STORE.whatsapp);

function kitchenStatus() {
  const now = new Date(), h = now.getHours() + now.getMinutes() / 60;
  const cur = mealHours.find(s => h >= s.hours[0] && h < s.hours[1]);
  if (cur) return { open: true, text: `Kitchen open · ${cur.title} until ${fmtH(cur.hours[1])}`, id: cur.id };
  const first = mealHours[0].hours[0];
  return { open: false, text: `Kitchen closed · Opens ${fmtH(first)}${h >= first ? " tomorrow" : ""}` };
}

const infoHTML = () => {
  const k = kitchenStatus();
  return `
  <div class="info">
    <section id="contact" class="card span-12"><h2>Contact</h2>
      <div class="status">
        <div>
          <p class="big">Open 24/7</p>
          <div class="line2">
            <span class="dot${k.open ? "" : " closed"}" id="kitchenStatus">${k.text}</span>
            <span class="phone">${phoneLabel}</span>
          </div>
        </div>
        <div class="actions">
          <a class="btn primary" href="https://wa.me/${STORE.whatsapp}" target="_blank" rel="noopener">Message on WhatsApp</a>
          <a class="btn ghost" href="https://wa.me/${STORE.whatsapp}" target="_blank" rel="noopener">Call on WhatsApp</a>
        </div>
      </div>
    </section>

    <section id="hours" class="card span-5"><h2>Hours</h2>
      <ul class="hours-list">
        <li><span class="k">Store</span><span class="v">24 hours · 7 days</span></li>
        <li class="group">Kitchen · every day</li>
        ${mealHours.map(s => `<li data-meal="${s.id}"${k.id === s.id ? ' class="now"' : ""}><span class="k">${s.title}</span><span class="v">${fmtHours(s.hours)}</span></li>`).join("")}
      </ul>
    </section>

    <section id="location" class="card span-7"><h2>Location</h2>
      <p class="addr">${STORE.name}<br>${STORE.address}</p>
      <div class="map"><iframe src="${mapEmbed}" title="Map to ${STORE.name}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <div class="loc-row">
        <span class="muted">Pickup at the counter or delivery nearby.</span>
        <a class="btn ghost" href="${mapsUrl}" target="_blank" rel="noopener">Get directions</a>
      </div>
    </section>

    <section id="how-to-order" class="card span-12"><h2>How to order</h2>
      <ol class="steps">
        <li><b>Pick your items</b><span>Tap <strong>Add</strong> under anything on the menu. Tap again for more.</span></li>
        <li><b>Review your order</b><span>Tap <strong>View order</strong> at the bottom, then choose pickup or delivery.</span></li>
        <li><b>Send it on WhatsApp</b><span>We get your full order with prices and confirm it in the chat.</span></li>
      </ol>
      <div class="tip"><span class="tag">#5</span><p>Ordering by phone? Every item has a number on its picture. Just tell us the numbers.</p></div>
    </section>
  </div>`;
};

let io;
function render() {
  const [catId, secId] = location.hash.slice(1).split("/");
  const g = CAT[catId];
  nav.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.cat === catId));
  if (!g) {
    subnav.innerHTML = "";
    menu.innerHTML = `<div class="cats">${CATEGORIES.map(g => `
      <a class="cat" href="#${g.id}"><span class="tile">${coverHTML(g)}</span>
        <span class="label">${g.title}</span><span class="hint2">${g.hint}</span></a>`).join("")}</div>`;
  } else {
    subnav.innerHTML = g.sections.map(s => `<a href="#${g.id}/${s.id}" data-sec="${s.id}">${s.title}</a>`).join("");
    menu.innerHTML = `<p class="group-title">${g.title}</p>${g.note ? `<p class="group-note">${g.note}</p>` : ""}` +
      (g.info ? infoHTML() : g.sections.map(s => `
      <section id="${s.id}">
        <h2>${s.title}</h2>${s.hours ? `<p class="hours">${fmtHours(s.hours)}<span class="now">Serving now</span></p>` : ""}
        <div class="grid">${s.items.map(itemHTML).join("")}</div>
      </section>`).join(""));
  }
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    subnav.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.sec === en.target.id));
    const on = subnav.querySelector("a.on");
    if (on) subnav.scrollTo({ left: on.offsetLeft - 40, behavior: "smooth" });
  }), { rootMargin: "-45% 0px -50% 0px" });
  menu.querySelectorAll("section").forEach(s => io.observe(s));
  markServing(); update();
  const target = secId && document.getElementById(secId);
  if (target) target.scrollIntoView({ behavior: "smooth" });
  else window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", render);

function markServing() {
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  mealHours.forEach(sec => {
    const el = document.getElementById(sec.id);
    if (el) el.classList.toggle("serving", h >= sec.hours[0] && h < sec.hours[1]);
  });
  const ks = document.getElementById("kitchenStatus");
  if (ks) {
    const k = kitchenStatus();
    ks.textContent = k.text; ks.classList.toggle("closed", !k.open);
    document.querySelectorAll(".hours-list li[data-meal]").forEach(li => li.classList.toggle("now", li.dataset.meal === k.id));
  }
}

function change(id, d) {
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  save(); update();
}

function update() {
  let count = 0, total = 0;
  document.querySelectorAll(".item").forEach(el => {
    const q = cart[el.dataset.id] || 0;
    el.classList.toggle("in", q > 0);
    el.querySelector(".badge").textContent = q;
    el.querySelector(".n").textContent = q;
  });
  const ids = Object.keys(cart).filter(id => ITEMS[id]);
  ids.forEach(id => { count += cart[id]; total += cart[id] * ITEMS[id].price; });
  $("#bar").classList.toggle("show", count > 0);
  $("#barCount").textContent = count + (count === 1 ? " item" : " items");
  $("#barTotal").textContent = money(total);
  $("#sheetTotal").textContent = money(total);
  $("#lines").innerHTML = ids.length ? ids.map(id => {
    const i = ITEMS[id];
    return `<div class="line" data-id="${id}">
      <div class="thumb"><img src="${img(id)}" alt=""></div>
      <div><div class="t">#${i.no} ${i.name}</div><div class="p"><b>${money(i.price)}</b> · ${i.sub}</div></div>
      <span class="step"><button type="button" data-act="dec">−</button><span>${cart[id]}</span><button type="button" data-act="add">+</button></span>
    </div>`;
  }).join("") : '<p class="hint" style="padding:24px 0">Your order is empty.</p>';
  if (!count) document.body.classList.remove("open");
  buildLinks(ids, total);
}

function buildLinks(ids, total) {
  const lines = ids.map(id => `${cart[id]} x #${ITEMS[id].no} ${ITEMS[id].name} (${ITEMS[id].sub}) - ${money(cart[id] * ITEMS[id].price)}`);
  const name = $("#cname").value.trim(), notes = $("#notes").value.trim(), addr = $("#addr").value.trim();
  const msg = [
    `Hi ${STORE.name}! I'd like to order:`, "",
    ...lines, "",
    `Total: ${money(total)}`,
    mode === "Delivery" ? `Delivery to: ${addr || "(address)"}` : "Pickup",
    name ? `Name: ${name}` : "",
    notes ? `Notes: ${notes}` : "",
  ].filter((l, i, a) => l !== "" || a[i - 1] !== "").join("\n");
  $("#sendWa").href = `https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(msg)}`;
  $("#callWa").href = `https://wa.me/${STORE.whatsapp}`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  change(b.closest("[data-id]").dataset.id, b.dataset.act === "add" ? 1 : -1);
});
$("#openBag").onclick = () => document.body.classList.add("open");
$("#closeBag").onclick = $("#scrim").onclick = () => document.body.classList.remove("open");
document.addEventListener("keydown", e => { if (e.key === "Escape") document.body.classList.remove("open"); });
$("#mode").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode;
  $("#mode").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  $("#addrField").hidden = mode !== "Delivery";
  update();
};
["#cname", "#notes", "#addr"].forEach(s => $(s).addEventListener("input", update));

const signEl = document.querySelector(".bodega-sign");
if (signEl) { signEl.style.cursor = "pointer"; signEl.addEventListener("click", () => { location.hash = ""; }); }

setInterval(markServing, 60000);
render();
</script>
<script src="sign.js" defer></script>
</body>
</html>
