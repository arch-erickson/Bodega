<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sign.css">
<style>body{margin:0;background:#fff;font-family:sans-serif} nav{position:sticky;top:var(--sign-h,0px);border-bottom:1px solid #ddd;padding:10px;background:#fff;z-index:10}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}.tile{position:relative;aspect-ratio:1;background:#f1f1f3;overflow:hidden;border:0;display:grid;place-items:center}
.tile img{max-width:78%;max-height:72%;object-fit:contain}</style>
<script>
var q=new URLSearchParams(location.search);
document.addEventListener("DOMContentLoaded",function(){var h=document.querySelector(".bodega-sign");
if(q.get("fs"))h.style.setProperty("--bs-fs",q.get("fs")+"px");
if(q.get("lines")){h.style.setProperty("--bs-lines",q.get("lines"));}
if(q.get("text"))document.getElementById("storeName").textContent=q.get("text");if(q.get("nh"))h.style.setProperty("--bs-nh",q.get("nh")+"px");});
</script></head><body>
<header class="bodega-sign" title="Back to menu home">
  <div class="bs-stage">
    <h1 class="bs-name" id="storeName">Gonzales Bodega</h1>
    <p class="bs-sub" id="storeLine">Deli • Grocery • 24 Hrs</p>
  </div>
</header>
<nav>nav</nav><div class="grid" id="g"></div>
<script>var s="";for(var i=0;i<12;i++)s+='<button class="tile"><img src="images/'+(q.get("img")||"chopped-cheese")+'.webp"></button>';document.getElementById("g").innerHTML=s;</script>
<script src="_t.js" defer></script></body></html>
